name: Build Samvartha APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q -o Samvartha.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Core unit tests
        working-directory: Samvartha
        run: gradle :core:test --stacktrace
      - name: Build debug APK
        working-directory: Samvartha
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: samvartha-debug-apk
          path: Samvartha/app/build/outputs/apk/debug/*.apk
          
